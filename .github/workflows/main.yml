name: V1rtu4lyz1um Autonomous Pipeline & PolyAPI Deploy

on:
  push:
    branches: [ master, main ]

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sqlalchemy pydantic

      - name: PolyAPI Deployment Action (Python)
        uses: polyapi/poly-deployment-action-py@v0.0.8
        with:
          poly_api_key: ${{ secrets.POLY_API_KEY }}
          poly_api_base_url: ${{ vars.POLY_API_BASE_URL || 'https://api.polyapi.io' }}
          do_checkout: false # Wir haben den Checkout schon oben erledigt
          working_directory: '.'
